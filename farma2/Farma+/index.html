<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farma+</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo">Farma<span>+</span></div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar">
    </div>
    <div class="menu">
      <div>🧾 Pedidos</div>
      <a href="carrinho.html">🛒 Carrinho</a>
      <div>👤 Perfil</div>
    </div>
  </header>

  <!-- CATEGORIAS -->
  <div class="categorias">
    <button>📦 Todas</button>
    <button>💊 Medicamentos</button>
    <button>💪 Suplementos</button>
    <button>🧴 Higiene</button>
    <button>🧒 Infantil</button>
    <button>💅 Beleza</button>
    <button>🔥 Promoções</button>
  </div>

  <!-- DESTAQUES -->
  <section class="px-4 my-4">
    <h2>Destaques</h2>
    <div class="lojas">
      <div class="loja">
        <img src="assets/img/drogacenter.png" alt="Droga Center">
        <p>Droga Center</p><span>Grátis</span>
      </div>
      <div class="loja">
        <img src="assets/img/drogariapacheco.png" alt="Drogaria Pacheco">
        <p>Drogaria Pacheco</p><span>Grátis</span>
      </div>
      <div class="loja">
        <img src="assets/img/drogasil.png" alt="Drogasil">
        <p>Drogasil</p><span>Grátis</span>
      </div>
    </div>

    <div class="banner" style="background-image:url('assets/img/banner.png');"></div>
  </section>

  <!-- PRODUTOS -->
  <section class="px-4 my-4">
    <h2>Mais comprados</h2>
    <div id="produtos" class="produtos"></div>
  </section>

  <footer>
    © 2025 Farma+ — Todos os direitos reservados.
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
